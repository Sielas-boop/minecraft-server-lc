services:
  mc:
    image: itzg/minecraft-server:latest 
    tty: true 
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      FORCE_WORLD_COPY: false
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      DIFFICULTY: "NORMAL"
      LEVEL: "LAST CHRISTMAS"
      MODRINTH_PROJECTS: |
        fabric-api
        cloth-config
        villagerapi
        more-villagers-re-employed
        weaponsexpanded
        fantazs-emerald-equipment
        tasty-vanilla
        lithium
        polymer 
        universal-shops
    volumes:
      - ./data/:/data:rw

